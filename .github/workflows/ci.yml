name: CI

# A pull request is built by its pull_request run, so push builds only master.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# A new push to a PR cancels that PR's older run. Runs on master are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (Linux)
    runs-on: ubuntu-latest

    steps:
      # The server, for its protocol fixtures; not its own submodules, which only its build needs.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build the page
        run: |
          npm ci
          npm run build

      - name: Test the page
        run: npm test
