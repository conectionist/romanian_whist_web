# The page and the server, both built from this checkout, one image at a time: docker compose build
# server, docker compose build web, docker compose up, then http://127.0.0.1:8000. The server's
# folder needs git submodule update --init --recursive first. The build has no git history to ask, so
# the commit About names is given: WHIST_WEB_COMMIT=$(git rev-parse HEAD) docker compose build web.
services:
  server:
    build:
      context: libs/romanian_whist_server
      args:
        JOBS: ${WHIST_JOBS:-2}
        WHIST_COMMIT: ${WHIST_SERVER_COMMIT:-}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # It must outlast the server's drain_ms (15 minutes): after SIGTERM the server lets the games
    # that someone is at end for up to that long, and Docker kills it when this runs out.
    stop_grace_period: 16m

  web:
    build:
      context: .
      args:
        WHIST_WEB_COMMIT: ${WHIST_WEB_COMMIT:-}
    depends_on:
      server: { condition: service_healthy }
    environment:
      SITE_ADDRESS: ":80"
      WHIST_SERVER_ADDRESS: server:8080
    ports: ["127.0.0.1:8000:80"]
